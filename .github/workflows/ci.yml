name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc valgrind
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --tb=short -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cpa-harness:ci .
      - name: Verify container starts
        run: |
          docker run -d --name ci-test -p 8000:8000 cpa-harness:ci
          sleep 3
          curl -sf http://localhost:8000/api/key/status | grep -q configured
          docker stop ci-test
